<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Persona RAG chatbot — short answers in character" />
  <title>Persona chat</title>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/chat.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__brand">
      <h1 class="app-header__title">Persona chat</h1>
      <p class="app-header__tagline">Short answers in character · local RAG</p>
    </div>
    <button type="button" class="btn btn--ghost" id="newChat" title="Start a fresh thread">
      New chat
    </button>
  </header>

  <main class="chat-main">
    <section
      id="log"
      class="chat-log"
      aria-label="Chat messages"
      aria-live="polite"
      aria-relevant="additions"
    ></section>
  </main>

  <footer class="app-footer">
    <div class="alert" id="err" role="alert" hidden></div>
    <p class="composer__status" id="composer-status" hidden></p>
    <form class="composer" id="form" autocomplete="off">
      <label for="msg" class="visually-hidden">Message</label>
      <div class="field">
        <textarea
          id="msg"
          class="field__input"
          name="message"
          rows="1"
          placeholder="Message…"
          maxlength="8000"
        ></textarea>
      </div>
      <button type="submit" class="btn btn--primary" id="send">Send</button>
    </form>
  </footer>

  <script type="module" src="/static/js/chat.js"></script>
</body>
</html>
